<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصميم المواقع الإلكترونية الفاخرة - تواصل عبر واتساب</title>
    <!-- استيراد خطوط فخمة وعصرية (Cinzel للعناوين و Tajawal للنصوص العربية) -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }
        .font-heading {
            font-family: 'Cinzel', serif;
            letter-spacing: 0.05em;
        }
        .font-body {
            font-family: 'Tajawal', sans-serif;
        }

        /* تأثيرات Liquid Glass الفاخرة */
        .liquid-glass-strong {
            background: rgba(255, 255, 255, 0.01);
            background-blend-mode: luminosity;
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            border: none;
            box-shadow: 4px 4px 4px rgba(0, 0, 0, 0.05),
                inset 0 1px 1px rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        .liquid-glass-strong::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.5) 0%,
                rgba(255, 255, 255, 0.2) 20%,
                rgba(255, 255, 255, 0) 40%,
                rgba(255, 255, 255, 0) 60%,
                rgba(255, 255, 255, 0.2) 80%,
                rgba(255, 255, 255, 0.5) 100%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <section class="relative py-32 px-6 md:px-16 lg:px-24 text-center overflow-hidden min-h-screen flex flex-col justify-between">
        <!-- Background HLS Video -->
        <video
            id="hls-video"
            autoPlay
            loop
            muted
            playsInline
            class="absolute inset-0 w-full h-full object-cover z-0"
        ></video>

        <!-- Top fade -->
        <div
            class="absolute top-0 left-0 right-0 z-[1] pointer-events-none"
            style="height: 200px; background: linear-gradient(to bottom, black, transparent);"
        ></div>
        <!-- Bottom fade -->
        <div
            class="absolute bottom-0 left-0 right-0 z-[1] pointer-events-none"
            style="height: 200px; background: linear-gradient(to top, black, transparent);"
        ></div>

        <!-- Content -->
        <div class="relative z-10 my-auto">
            <h2 class="text-4xl md:text-5xl lg:text-6xl font-heading font-bold text-white tracking-tight leading-[1.2] max-w-4xl mx-auto mb-6">
                صمم موقعك باحترافية وتكامل رقمي فائق.
            </h2>
            <p class="text-white/60 font-body font-light text-base md:text-lg max-w-xl mx-auto mb-10">
                تواصل معي مباشرة عبر واتساب لبدء مشروعك الرقمي. دقة عالية وسرعة فائقة لتنمية أعمالك على الإنترنت.
            </p>
            
            <div class="flex items-center justify-center gap-6 flex-wrap">
                <!-- زر الواتساب الأول (Liquid Glass) -->
                <a href="https://wa.me/966569500870?text=مرحباً، أرغب في طلب تصميم موقع إلكتروني احترافي." target="_blank" class="liquid-glass-strong rounded-full px-8 py-3.5 text-base font-medium text-white flex items-center gap-3 hover:bg-white/10 transition-all font-body">
                    <span>تواصل عبر واتساب</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 17L17 7M17 7H7M17 7v10" />
                    </svg>
                </a>
                
                <!-- زر واتساب الثاني (Solid White) -->
                <a href="https://wa.me/966569500870?text=مرحباً، أود الاستفسار عن أسعار وخدمات تصميم المواقع." target="_blank" class="bg-white text-black rounded-full px-8 py-3.5 text-base font-medium flex items-center gap-3 hover:bg-white/90 transition-colors font-body shadow-lg">
                    <span>احصل على العرض</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 17L17 7M17 7H7M17 7v10" />
                    </svg>
                </a>
            </div>
        </div>

        <!-- Footer -->
        <div class="relative z-10 mt-32 pt-8 border-t border-white/10 flex flex-col md:flex-row items-center justify-between gap-4 max-w-7xl mx-auto w-full">
            <p class="text-white/40 font-body font-light text-xs">
                &copy; 2026 Studio. All rights reserved. واتساب: 0569500870
            </p>
            <div class="flex items-center gap-6">
                <a href="https://wa.me/966569500870" target="_blank" class="text-white/40 hover:text-white/70 font-body font-light text-xs transition-colors">الخصوصية</a>
                <a href="https://wa.me/966569500870" target="_blank" class="text-white/40 hover:text-white/70 font-body font-light text-xs transition-colors">الشروط</a>
                <a href="https://wa.me/966569500870" target="_blank" class="text-white/40 hover:text-white/70 font-body font-light text-xs transition-colors">اتصل بنا</a>
            </div>
        </div>
    </section>

    <!-- تهيئة تشغيل فيديو HLS -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const video = document.getElementById("hls-video");
            const videoSrc = "https://stream.mux.com/8wrHPCX2dC3msyYU9ObwqNdm00u3ViXvOSHUMRYSEe5Q.m3u8";

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(videoSrc);
                hls.attachMedia(video);
            } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                video.src = videoSrc;
            }
        });
    </script>
</body>
</html>
