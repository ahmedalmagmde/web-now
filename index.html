<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlElement">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Design | تصميم المواقع الإلكتروني </title>
    <!-- استيراد خطوط فخمة وعصرية (Cairo و Almarai) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }
        .font-heading {
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            letter-spacing: 0.02em;
        }
        .font-body {
            font-family: 'Almarai', sans-serif;
            font-weight: 700;
        }

        /* تأثيرات Liquid Glass الفاخرة */
        .liquid-glass-strong {
            background: rgba(255, 255, 255, 0.01);
            background-blend-mode: luminosity;
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            border: none;
            box-shadow: 4px 4px 4px rgba(0, 0, 0, 0.05),
                inset 0 1px 1px rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .liquid-glass-strong:hover {
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 8px 8px 16px rgba(0, 0, 0, 0.1),
                inset 0 1px 1px rgba(255, 255, 255, 0.25);
            transform: translateY(-4px);
        }

        .liquid-glass-strong::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.5) 0%,
                rgba(255, 255, 255, 0.2) 20%,
                rgba(255, 255, 255, 0) 40%,
                rgba(255, 255, 255, 0) 60%,
                rgba(255, 255, 255, 0.2) 80%,
                rgba(255, 255, 255, 0.5) 100%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* حركات الظهور */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        h2 {
            animation: fadeInUp 0.8s ease-out;
        }

        p {
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        .flex.items-center {
            animation: slideInRight 0.8s ease-out 0.4s both;
        }

        #langToggle {
            animation: fadeInScale 0.6s ease-out;
        }

        a {
            position: relative;
        }

        a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: currentColor;
            transition: width 0.3s ease;
            opacity: 0.5;
        }

        a:hover::after {
            width: 100%;
        }

        video {
            animation: fadeInScale 1s ease-out 0.5s both;
        }
    </style>
</head>
<body>

    <section class="relative py-32 px-6 md:px-16 lg:px-24 text-center overflow-hidden min-h-screen flex flex-col justify-between">
        <!-- Language Toggle Button -->
        <div class="absolute top-8 left-8 z-20">
            <button id="langToggle" class="liquid-glass-strong rounded-full px-6 py-2 text-sm font-bold text-white hover:bg-white/10 transition-all">
                English
            </button>
        </div>

        <!-- Background HLS Video -->
        <video
            id="hls-video"
            autoPlay
            loop
            muted
            playsInline
            class="absolute inset-0 w-full h-full object-cover z-0"
        ></video>

        <!-- Top fade -->
        <div
            class="absolute top-0 left-0 right-0 z-[1] pointer-events-none"
            style="height: 200px; background: linear-gradient(to bottom, black, transparent);"
        ></div>
        <!-- Bottom fade -->
        <div
            class="absolute bottom-0 left-0 right-0 z-[1] pointer-events-none"
            style="height: 200px; background: linear-gradient(to top, black, transparent);"
        ></div>

        <!-- Content -->
        <div class="relative z-10 my-auto">
            <h2 class="text-5xl md:text-6xl lg:text-7xl font-heading text-blue tracking-wide leading-[1.1] max-w-4xl mx-auto mb-6" data-ar="صمم موقعك باحترافية" data-en="Design Your Website Professionally">
                 صمم موقعك باحترافية
            </h2>
            <p class="text-white/70 font-body text-lg md:text-xl max-w-xl mx-auto mb-10" data-ar="تواصل معي مباشرة عبر واتساب لبدء مشروعك الالكتروني" data-en="Contact me directly via WhatsApp to start your electronic project">
                تواصل معي مباشرة عبر واتساب لبدء مشروعك الاكتروني 
            </p>
            
            <div class="flex items-center justify-center gap-6 flex-wrap">
                <!-- زر الواتساب الأول (Liquid Glass) -->
                <a href="https://wa.me/966569500870?text=السلام عليكم ، أرغب في طلب تصميم موقع إلكتروني " target="_blank" class="liquid-glass-strong rounded-full px-8 py-3.5 text-lg font-bold text-white flex items-center gap-3 hover:bg-white/10 transition-all font-body" data-ar="تواصل عبر واتساب" data-en="Contact via WhatsApp">
                    <span>تواصل عبر واتساب</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 17L17 7M17 7H7M17 7v10" />
                    </svg>
                </a>
                
                <!-- زر واتساب الثاني (Solid White) -->
                <a href="https://wa.me/966569500870?text=السلام عليكم، أود الاستفسار عن أسعار وخدمات تصميم المواقع لديكم ." target="_blank" class="bg-white text-black rounded-full px-8 py-3.5 text-lg font-bold flex items-center gap-3 hover:bg-white/90 transition-colors font-body shadow-lg" data-ar="احصل على العرض" data-en="Get the Offer">
                    <span>احصل على العرض</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 17L17 7M17 7H7M17 7v10" />
                    </svg>
                </a>
            </div>
        </div>

    <!-- تهيئة تشغيل فيديو HLS وتبديل اللغة -->
    <script>
        let currentLang = 'ar';
        const htmlElement = document.documentElement;

        // تهيئة الفيديو
        document.addEventListener("DOMContentLoaded", () => {
            const video = document.getElementById("hls-video");
            const videoSrc = "https://stream.mux.com/8wrHPCX2dC3msyYU9ObwqNdm00u3ViXvOSHUMRYSEe5Q.m3u8";

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(videoSrc);
                hls.attachMedia(video);
            } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                video.src = videoSrc;
            }

            // تبديل اللغة
            const langToggle = document.getElementById('langToggle');
            langToggle.addEventListener('click', toggleLanguage);

            // تحميل اللغة المحفوظة
            const savedLang = localStorage.getItem('language') || 'ar';
            if (savedLang === 'en') {
                toggleLanguage();
            }
        });

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('language', currentLang);

            // تغيير اتجاه الصفحة
            htmlElement.lang = currentLang;
            htmlElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';

            // تحديث جميع العناصر التي تحتوي على بيانات اللغة
            document.querySelectorAll('[data-ar][data-en]').forEach(element => {
                const text = currentLang === 'ar' ? element.dataset.ar : element.dataset.en;
                
                if (element.tagName === 'A' || element.tagName === 'BUTTON') {
                    // للروابط والأزرار
                    const span = element.querySelector('span');
                    if (span) {
                        span.textContent = text;
                    }
                } else {
                    // للعناصر العادية
                    element.textContent = text;
                }
            });

            // تحديث زر التبديل
            const langToggle = document.getElementById('langToggle');
            langToggle.textContent = currentLang === 'ar' ? 'English' : 'العربية';
        }
    </script>
</body>
</html>
